name: job-alerts
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (private repo free-minutes budget)
  workflow_dispatch:          # lets you run it manually from the Actions tab
permissions:
  contents: write             # needed to save seen.json back to the repo
concurrency: job-alerts
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python jobbot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_INTL: ${{ secrets.TELEGRAM_CHAT_ID_INTL }}
      - name: Save seen jobs
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          git add seen.json resolved.json
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
